<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compétences | Lenny Grenier</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header"></div>

  <section>
    <div class="container">
      <h2 class="section-title">Compétences</h2>
      <div class="grid">

        <!-- ✏️ AJUSTE LES NIVEAUX (data-level = pourcentage) -->
        <div class="card">
          <h3>DevOps & Cloud</h3>
          <div class="skill">
            <div class="skill-head"><span>Docker</span><span>80%</span></div>
            <div class="bar"><div class="bar-fill" data-level="80"></div></div>
          </div>
          <div class="skill">
            <div class="skill-head"><span>CI/CD</span><span>70%</span></div>
            <div class="bar"><div class="bar-fill" data-level="70"></div></div>
          </div>
          <div class="skill">
            <div class="skill-head"><span>Ansible</span><span>60%</span></div>
            <div class="bar"><div class="bar-fill" data-level="60"></div></div>
          </div>
        </div>

        <div class="card">
          <h3>Systèmes & Réseaux</h3>
          <div class="skill">
            <div class="skill-head"><span>Linux</span><span>85%</span></div>
            <div class="bar"><div class="bar-fill" data-level="85"></div></div>
          </div>
          <div class="skill">
            <div class="skill-head"><span>Bash</span><span>75%</span></div>
            <div class="bar"><div class="bar-fill" data-level="75"></div></div>
          </div>
          <div class="skill">
            <div class="skill-head"><span>Réseaux</span><span>65%</span></div>
            <div class="bar"><div class="bar-fill" data-level="65"></div></div>
          </div>
        </div>

        <div class="card">
          <h3>Développement</h3>
          <div class="skill">
            <div class="skill-head"><span>Python</span><span>70%</span></div>
            <div class="bar"><div class="bar-fill" data-level="70"></div></div>
          </div>
          <div class="skill">
            <div class="skill-head"><span>PHP / SQL</span><span>65%</span></div>
            <div class="bar"><div class="bar-fill" data-level="65"></div></div>
          </div>
          <div class="skill">
            <div class="skill-head"><span>Git</span><span>80%</span></div>
            <div class="bar"><div class="bar-fill" data-level="80"></div></div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <div id="footer"></div>
  <script src="/js/main.js"></script>
</body>
</html>
